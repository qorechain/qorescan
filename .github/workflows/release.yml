# SPDX-License-Identifier: Apache-2.0
#
# Runs on a pushed tag v<version>. GoReleaser builds the binaries, archives
# and checksum file and creates a draft GitHub release. The npm and PyPI
# wrapper packages are then built with the release's SHA-256 digests embedded
# and attached to the workflow run. Each registry is published only when its
# secret is set and after the GitHub release has been published by hand.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/qorescan_*_checksums.txt
            dist/qorescan_*_*_*

  wrappers:
    needs: [binaries]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Embed the release digests
        run: |
          version="${GITHUB_REF_NAME#v}"
          python scripts/wrapper-checksums.py "dist/qorescan_${version}_checksums.txt" "$version"
      - name: Wrapper tests against the release binary
        run: |
          version="${GITHUB_REF_NAME#v}"
          bin="dist/qorescan_${version}_linux_amd64"
          chmod +x "$bin"
          export QORESCAN_TEST_BINARY="$PWD/$bin"
          (cd npm && npm test)
          python -m unittest discover -s python/tests -v
      - name: Pack
        run: |
          cp LICENSE NOTICE npm/
          cp LICENSE NOTICE python/
          mkdir -p packages
          (cd npm && npm pack --pack-destination ../packages)
          python -m pip install build==1.3.0
          python -m build python --outdir packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wrappers
          path: packages

  publish-npm:
    needs: [wrappers]
    runs-on: ubuntu-24.04
    environment: release
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.NPM_TOKEN != ''
        with:
          name: wrappers
          path: packages
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.NPM_TOKEN != ''
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public packages/qorechain-qorescan-*.tgz

  publish-pypi:
    needs: [wrappers]
    runs-on: ubuntu-24.04
    environment: release
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.PYPI_TOKEN != ''
        with:
          name: wrappers
          path: packages
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: env.PYPI_TOKEN != ''
        with:
          python-version: "3.12"
      - name: Publish to PyPI
        if: env.PYPI_TOKEN != ''
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install twine==7.0.0
          python -m twine check --strict packages/*.whl packages/*.tar.gz
          python -m twine upload --non-interactive packages/*.whl packages/*.tar.gz
